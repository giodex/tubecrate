name: Release

# Push a version tag to cut a release, e.g.:
#   git tag v1.1 && git push origin v1.1
#
# The app is ad-hoc signed. To ship a Developer ID–signed, notarized build,
# see Scripts/notarize.sh and Scripts/make-dmg.sh.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .app (ad-hoc signed)
        run: ./Scripts/build-app.sh

      - name: Zip + checksum
        id: pkg
        run: |
          cd build
          ZIP="Tubecrate-${{ steps.ver.outputs.version }}.zip"
          ditto -c -k --keepParent Tubecrate.app "$ZIP"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Tubecrate ${{ steps.ver.outputs.version }}"
            echo "zip sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Tubecrate-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          body: |
            ### Download & install
            Grab the `.zip` below, unzip it, drag **Tubecrate.app** to Applications.

            The app is ad-hoc signed (not notarized): on first launch right-click → **Open**,
            or run `xattr -dr com.apple.quarantine /Applications/Tubecrate.app`.

            You'll need `yt-dlp` and `ffmpeg` (`brew install yt-dlp ffmpeg`, or install them from Settings).
